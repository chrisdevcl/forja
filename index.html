<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forja</title>
  <meta name="description" content="Las habilidades que nadie enseña en el colegio." />
  <meta name="theme-color" content="#1A1A2E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Forja" />

  <link rel="icon" type="image/x-icon"    href="brand/favicon.ico" />
  <link rel="icon" type="image/svg+xml"   href="brand/favicon.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="brand/favicon-96.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="brand/favicon-16.png" />
  <link rel="apple-touch-icon"            href="brand/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="splash">
    <img src="brand/icon-192.png" alt="Forja" style="border-radius:22px; width:96px; height:96px;">
    <div class="splash-spinner"></div>
  </div>

  <div id="app">
    <div class="home"   id="view-home"></div>
    <div class="detail" id="view-detail"></div>
    <div class="toast"  id="toast"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });

      // Cuando un nuevo SW toma control, recargar para cargar assets frescos.
      // El flag evita bucles de recarga infinita.
      let swRefreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (swRefreshing) return;
        swRefreshing = true;
        window.location.reload();
      });
    }
  </script>
</body>
</html>
